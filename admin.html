<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Véloc'Annecy</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --admin-bg: #f1f5f9;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        .admin-section {
            padding: 30px 0 60px;
            min-height: 100vh;
            background: var(--admin-bg);
        }
        .container { width: 95%; max-width: 1400px; margin: 0 auto; }

        /* PIN */
        .pin-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
        }
        .pin-overlay.hidden { display: none; }
        .pin-box {
            background: white; border-radius: 20px; padding: 32px;
            text-align: center; width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .pin-box .lock-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .pin-box h2 { margin: 0 0 4px 0; font-size: 1.1rem; color: #1e293b; }
        .pin-box p { margin: 0 0 16px 0; font-size: 0.78rem; color: var(--text-muted); }
        .pin-dots { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
        .pin-dots .dot {
            width: 14px; height: 14px; border-radius: 50%;
            border: 2px solid #e2e8f0; background: white;
            transition: all 0.15s;
        }
        .pin-dots .dot.filled { background: #7cc3ef; border-color: #7cc3ef; }
        .pin-dots .dot.wrong { background: #ef4444; border-color: #ef4444; }
        .pin-error { font-size: 0.78rem; color: var(--danger); min-height: 20px; margin-bottom: 8px; }
        .pin-numpad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .pin-numpad button {
            padding: 14px; border: none; border-radius: 12px; font-size: 1.3rem;
            font-weight: 700; background: #f1f5f9; cursor: pointer;
            transition: all 0.1s; color: #1e293b;
        }
        .pin-numpad button:hover { background: #e2e8f0; }
        .pin-numpad button:active { transform: scale(0.95); }
        .pin-numpad .blank { background: transparent; cursor: default; }
        .pin-numpad .delete { font-size: 1rem; color: var(--text-muted); }
        .pin-numpad .delete:hover { background: #fee2e2; color: var(--danger); }

        .db-status { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; padding: 3px 10px; border-radius: 50px; font-weight: 600; }
        .db-status.online { background: #d1fae5; color: #065f46; }
        .db-status.offline { background: #fee2e2; color: #991b1b; }

        .btn { padding: 8px 14px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 4px; }
        .btn:hover { transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: #1e293b; }
        .btn-outline:hover { border-color: #7cc3ef; }
        .btn-sm { padding: 4px 10px; font-size: 0.7rem; }

        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 100%; background: var(--card-bg); }
        th { background: #7cc3ef; color: white; padding: 12px 14px; text-align: left; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
        td { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafc; }
    </style>
</head>
<body>
    <!-- PIN -->
    <div class="pin-overlay" id="pin-overlay">
        <div class="pin-box">
            <div class="lock-icon">🔒</div>
            <h2>Véloc'Annecy</h2>
            <p>Entrez le code PIN pour accéder à l'administration</p>
            <div class="pin-dots" id="pin-dots">
                <span class="dot" data-idx="0"></span>
                <span class="dot" data-idx="1"></span>
                <span class="dot" data-idx="2"></span>
                <span class="dot" data-idx="3"></span>
            </div>
            <div class="pin-error" id="pin-error"></div>
            <div class="pin-numpad">
                <button data-num="1">1</button>
                <button data-num="2">2</button>
                <button data-num="3">3</button>
                <button data-num="4">4</button>
                <button data-num="5">5</button>
                <button data-num="6">6</button>
                <button data-num="7">7</button>
                <button data-num="8">8</button>
                <button data-num="9">9</button>
                <span class="blank"></span>
                <button data-num="0">0</button>
                <button class="delete" id="pin-delete">⌫</button>
            </div>
        </div>
    </div>

    <div class="alert-banner"><span>⚙️ Administration Véloc'Annecy</span></div>

    <header class="with-banner">
        <div class="container header-flex" style="max-width:1400px;">
            <div class="logo"><a href="index.html"><img src="assets/logo_veloc.png" alt="Logo" class="logo-img"></a></div>
            <nav>
                <a href="index.html">← Retour au site</a>
                <a href="connexion.html">👥 Employés</a>
            </nav>
        </div>
    </header>

    <!-- ⏱️ TEMPS DE LECTURE PAR PROCÉDURE -->
    <section class="admin-section">
        <div class="container" style="max-width:1400px;">
            <h1 style="text-align:center;margin:0 0 30px;">👥 Temps de lecture par procédure</h1>

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
                <button id="employee-time-refresh" class="btn btn-outline btn-sm">🔄 Rafraîchir</button>
                <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                    <button id="emp-time-today" class="btn btn-outline btn-sm">📅 Aujourd'hui</button>
                    <button id="emp-time-all" class="btn btn-outline btn-sm" style="border-color:#7cc3ef;">🗓️ Tout</button>
                </div>
            </div>

            <!-- Totaux par employé -->
            <div id="emp-time-totals" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;"></div>

            <!-- Tableau des temps par procédure -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Employé</th>
                            <th>Procédure</th>
                            <th>Ouvertures</th>
                            <th>Temps total</th>
                            <th>Dernière lecture</th>
                        </tr>
                    </thead>
                    <tbody id="emp-time-tbody">
                        <tr>
                            <td colspan="5" style="text-align:center;color:var(--text-muted);font-style:italic;">
                                Chargement des données...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <footer>
        <div class="container text-center">
            <p>&copy; 2026 Véloc'Annecy · <a href="index.html" style="color:#64748b;text-decoration:underline;font-size:0.8rem;">Retour au site</a></p>
        </div>
    </footer>

    <script src="supabase.js"></script>
    <script>
        // ============================================================
        // CODE PIN
        // ============================================================
        const PIN_CODE = '3300';
        const UNLOCKED_KEY = 'veloc_admin_unlocked';

        function setupPinScreen() {
            const overlay = document.getElementById('pin-overlay');
            if (!overlay) return;

            if (localStorage.getItem(UNLOCKED_KEY) === '1') {
                overlay.classList.add('hidden');
                initTimeView();
                return;
            }

            const dots = overlay.querySelectorAll('.dot');
            const errorEl = document.getElementById('pin-error');
            const delBtn = document.getElementById('pin-delete');
            let pin = '';

            function updateDots(wrong) {
                dots.forEach((d, i) => {
                    d.classList.remove('filled', 'wrong');
                    if (i < pin.length) d.classList.add('filled');
                    if (wrong) d.classList.add('wrong');
                });
            }
            function clearError() { if (errorEl) errorEl.textContent = ''; }

            overlay.addEventListener('click', (e) => {
                const numBtn = e.target.closest('[data-num]');
                if (numBtn) {
                    clearError();
                    if (pin.length >= 4) return;
                    pin += numBtn.dataset.num;
                    updateDots(false);
                    if (pin.length === 4) {
                        if (pin === PIN_CODE) {
                            localStorage.setItem(UNLOCKED_KEY, '1');
                            overlay.classList.add('hidden');
                            initTimeView();
                        } else {
                            if (errorEl) errorEl.textContent = '❌ Code incorrect';
                            updateDots(true);
                            setTimeout(() => { pin = ''; updateDots(false); }, 600);
                        }
                    }
                }
                if (e.target === delBtn || e.target.closest('#pin-delete')) {
                    clearError();
                    pin = pin.slice(0, -1);
                    updateDots(false);
                }
            });
        }

        // ============================================================
        // TEMPS DE LECTURE PAR PROCÉDURE
        // ============================================================
        let empTimeMode = 'all'; // 'all' | 'today'

        function formatDur(totalSeconds) {
            totalSeconds = Math.max(0, Math.round(totalSeconds || 0));
            if (totalSeconds === 0) return '0s';
            if (totalSeconds < 60) return totalSeconds + 's';
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            if (m < 60) return s > 0 ? m + 'min ' + s + 's' : m + 'min';
            const h = Math.floor(m / 60);
            const rm = m % 60;
            return rm > 0 ? h + 'h ' + rm + 'min' : h + 'h';
        }

        function formatDateTime(iso) {
            if (!iso) return '—';
            try {
                const d = new Date(iso);
                return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' +
                    d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            } catch { return '—'; }
        }

        async function loadEmployeeTime() {
            const tbody = document.getElementById('emp-time-tbody');
            const totalsEl = document.getElementById('emp-time-totals');
            if (!tbody || !totalsEl) return;

            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);font-style:italic;">Chargement...</td></tr>';
            totalsEl.innerHTML = '';

            if (!window._supabase) {
                try { initSupabase(); } catch (e) { /* déjà init */ }
            }

            if (!window._supabase) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);font-style:italic;">Supabase non configuré (mode local).</td></tr>';
                return;
            }

            try {
                let query = window._supabase
                    .from('employee_procedure_views')
                    .select('id,employee_name,procedure_key,procedure_title,view_start,view_end,active_seconds,device_name')
                    .order('view_start', { ascending: false })
                    .limit(500);

                if (empTimeMode === 'today') {
                    const start = new Date();
                    start.setHours(0, 0, 0, 0);
                    query = query.gte('view_start', start.toISOString());
                }

                const { data, error } = await query;
                if (error) throw error;

                const views = data || [];

                // --- Agréger par employé × procédure ---
                const agg = {};
                views.forEach(v => {
                    const empName = (v.employee_name || 'Inconnu');
                    const procName = (v.procedure_title || v.procedure_key || 'Inconnue');
                    const key = empName.toLowerCase() + '||' + procName.toLowerCase();
                    if (!agg[key]) {
                        agg[key] = {
                            employee: empName,
                            procedure: procName,
                            openCount: 0,
                            totalSeconds: 0,
                            lastView: v.view_start || null
                        };
                    }
                    agg[key].openCount++;
                    agg[key].totalSeconds += Math.max(0, Math.round(v.active_seconds || 0));
                    if (v.view_start && (!agg[key].lastView || new Date(v.view_start) > new Date(agg[key].lastView))) {
                        agg[key].lastView = v.view_start;
                    }
                });

                const aggRows = Object.values(agg).sort((a, b) => b.totalSeconds - a.totalSeconds);

                // --- Totaux par employé ---
                const totalsByEmp = {};
                aggRows.forEach(r => {
                    const key = r.employee.toLowerCase();
                    if (!totalsByEmp[key]) {
                        totalsByEmp[key] = { employee: r.employee, totalSeconds: 0, procCount: 0 };
                    }
                    totalsByEmp[key].totalSeconds += r.totalSeconds;
                    totalsByEmp[key].procCount++;
                });

                const totalsSorted = Object.values(totalsByEmp).sort((a, b) => b.totalSeconds - a.totalSeconds);

                totalsEl.innerHTML = totalsSorted.map(t =>
                    '<div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:8px 12px;text-align:center;min-width:130px;">' +
                    '<div style="font-size:0.65rem;color:var(--text-muted);font-weight:600;">' + t.employee + '</div>' +
                    '<div style="font-size:1rem;font-weight:800;color:#1e293b;">' + formatDur(t.totalSeconds) + '</div>' +
                    '<div style="font-size:0.6rem;color:var(--text-muted);">' + t.procCount + ' procédure(s)</div>' +
                    '</div>'
                ).join('') ||
                    '<div style="font-size:0.8rem;color:var(--text-muted);font-style:italic;">Aucune donnée.</div>';

                // --- Tableau ---
                if (aggRows.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);font-style:italic;">Aucune lecture enregistrée.</td></tr>';
                    return;
                }

                tbody.innerHTML = aggRows.map(r =>
                    '<tr>' +
                    '<td style="font-weight:700;color:#1e293b;">' + r.employee + '</td>' +
                    '<td>' + r.procedure + '</td>' +
                    '<td>' + r.openCount + '</td>' +
                    '<td style="font-weight:700;color:#065f46;">' + formatDur(r.totalSeconds) + '</td>' +
                    '<td>' + formatDateTime(r.lastView) + '</td>' +
                    '</tr>'
                ).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--danger);font-style:italic;">Erreur : ' + e.message + '</td></tr>';
            }
        }

        function initTimeView() {
            // Boutons filtre
            document.getElementById('emp-time-today').addEventListener('click', () => {
                empTimeMode = 'today';
                document.getElementById('emp-time-today').style.borderColor = '#7cc3ef';
                document.getElementById('emp-time-all').style.borderColor = 'var(--border)';
                loadEmployeeTime();
            });

            document.getElementById('emp-time-all').addEventListener('click', () => {
                empTimeMode = 'all';
                document.getElementById('emp-time-all').style.borderColor = '#7cc3ef';
                document.getElementById('emp-time-today').style.borderColor = 'var(--border)';
                loadEmployeeTime();
            });

            document.getElementById('employee-time-refresh').addEventListener('click', loadEmployeeTime);

            // Charger avec un petit délai pour laisser Supabase s'initialiser
            setTimeout(loadEmployeeTime, 1000);
        }

        // Démarrage
        setupPinScreen();
    </script>
</body>
</html>
